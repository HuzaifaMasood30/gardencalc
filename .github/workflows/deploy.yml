name: Deploy site

# The SEO pipeline only runs on a daily cron, so code/template/config changes would
# otherwise sit unpublished until the next scheduled run. This rebuilds and deploys
# whenever the files that affect the built site change on main.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "static/**"
      - "config/**"
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as the SEO pipeline so the two deployments serialise instead of racing
# GitHub Pages.
concurrency:
  group: seo-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python scripts/tests.py

      - name: Build
        env:
          SITE_BASE_URL: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && format('https://{0}.github.io', github.repository_owner) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python scripts/build.py

      - name: Fail if the built site has broken links, bad sitemap or missing tags
        run: python scripts/verify.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
