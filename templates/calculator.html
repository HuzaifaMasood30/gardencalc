{% if calc %}
<div class="calc" data-calc-shell>
  <h2><svg aria-hidden="true"><use href="#i-calc"></use></svg>{{ calc.title }}</h2>
  <p class="calc-sub">{{ calc.sub }}</p>
  <form class="calc-form" data-calc="{{ calc.key }}" aria-label="{{ calc.title }}">
    {% for inp in calc.inputs %}
    <label for="in-{{ inp.id }}">{{ inp.label }}
      {% if inp.options %}
      <select id="in-{{ inp.id }}" name="{{ inp.id }}">
        {% for opt in inp.options %}
        <option value="{{ opt.value }}"{% if opt.value == inp.default %} selected{% endif %}>{{ opt.label }}</option>
        {% endfor %}
      </select>
      {% else %}
      <input type="number" inputmode="decimal" id="in-{{ inp.id }}" name="{{ inp.id }}"
             min="{{ inp.min }}" max="{{ inp.max }}" step="{{ inp.step|default('0.1') }}"
             value="{{ inp.default }}">
      {% endif %}
    </label>
    {% endfor %}
    <button type="button" class="calc-go">Calculate</button>
  </form>
  <div class="calc-result" role="status" aria-live="polite"></div>
  <div class="calc-actions">
    <button type="button" class="calc-copy" data-act="copy">Copy result</button>
    <button type="button" class="calc-print" data-act="print">Print</button>
    <button type="button" class="calc-share" data-act="share">Share link</button>
  </div>
  <p class="calc-hint">{{ calc.hint }}</p>
</div>
{% endif %}
