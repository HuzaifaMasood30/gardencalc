{% set calc = article.calculator %}
{% set cdef = calc_defs.get(calc) %}
{% if cdef %}
<section class="calc" aria-labelledby="calc-heading">
  <h2 id="calc-heading">{{ cdef.title }}</h2>
  <form class="calc-form" data-calc="{{ calc }}" onsubmit="return false;">
    {% for inp in cdef.inputs %}
    <label for="in-{{ inp.id }}">{{ inp.label }}
      <input id="in-{{ inp.id }}" name="{{ inp.id }}" type="number"
             value="{{ article.calculator_defaults[inp.id] }}"
             min="{{ inp.min }}" max="{{ inp.max }}" step="any" inputmode="decimal">
    </label>
    {% endfor %}
    <button type="button" class="calc-go">Calculate</button>
  </form>
  <div class="calc-result" aria-live="polite" data-outputs="{{ cdef.outputs | join(',') }}">
    <p class="calc-hint">Enter your measurements and press Calculate.</p>
  </div>
  <noscript>
    <p>JavaScript is off. Default results are shown in the article table below.</p>
  </noscript>
</section>
{% endif %}
