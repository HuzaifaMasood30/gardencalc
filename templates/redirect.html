{% extends "base.html" %}
{% block head_extra %}<meta http-equiv="refresh" content="0; url={{ target_url }}">{% endblock %}
{% block content %}
<div class="wrap">
  <h1>{{ page.title }}</h1>
  <p>This page has moved. You will be taken to <a href="{{ target_url }}">{{ target_title }}</a> automatically.</p>
  <p><a class="btn" href="{{ target_url }}">Go to {{ target_title }}</a> &middot;
     <a href="{{ base_url }}/">Home</a></p>
</div>
{% endblock %}
